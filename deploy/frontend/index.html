<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Station</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Saira:wdth,wght@75..125,200..600&display=swap" rel="stylesheet">
<style>
:root{
  --void:#000000; --signal:#ffffff; --ash:#7a7a7a; --graphite:#1e1e1e; --dim:#3a3a3a;
  --blue:#3d7be0; --brown:#8b5a2b; --red:#d33b3b; --white:#f2f2f2; --yellow:#f2c230; --purple:#9b7fe0; --orange:#f08a24;
  --rail:clamp(14px,2.2vw,32px);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--void);color:var(--signal);overflow:hidden}
body{font-family:"Saira",system-ui,sans-serif;font-variant-numeric:tabular-nums;font-stretch:112%;font-weight:300;
  -webkit-font-smoothing:antialiased;cursor:none}
body:hover{cursor:default}

/* floor: a dot grid receding in perspective, like the station's own table */
.floor{position:fixed;left:-40%;right:-40%;bottom:0;height:75%;pointer-events:none;
  background-image:radial-gradient(circle,#6a6a6a 2.4px,transparent 3px);background-size:44px 44px;
  transform:perspective(700px) rotateX(55deg);transform-origin:bottom center;
  mask-image:linear-gradient(to top,rgba(0,0,0,.9),transparent 85%);-webkit-mask-image:linear-gradient(to top,rgba(0,0,0,.9),transparent 85%)}

/* the twin: the one bold element */
.twin{position:fixed;inset:0;display:grid;place-items:center}
.twin img{width:min(100vw,calc(100vh*16/9));height:auto;max-height:100vh;object-fit:contain;
  mask-image:radial-gradient(ellipse 62% 64% at 50% 52%,#000 58%,transparent 100%);
  -webkit-mask-image:radial-gradient(ellipse 62% 64% at 50% 52%,#000 58%,transparent 100%);
  opacity:0;transition:opacity 1.2s ease}
.twin img.live{opacity:1}
.twin .wait{position:absolute;width:64px;height:64px;border:1px solid var(--dim);border-radius:50%;
  animation:breathe 2.4s ease-in-out infinite}
.twin img.live ~ .wait{display:none}
@keyframes breathe{50%{transform:scale(1.25);border-color:var(--ash)}}

/* instruments */
.inst{position:fixed;transition:opacity .6s}
body.offline .inst{opacity:.22}
.mono{top:var(--rail);left:var(--rail);display:flex;align-items:flex-start;gap:6px}
.mono b{font-weight:500;font-size:clamp(22px,2.6vw,38px);line-height:1;font-stretch:125%;letter-spacing:.02em}
.mono sup{font-size:.55em;color:var(--ash);font-weight:400;margin-top:2px}
.phase{display:block;width:clamp(28px,3vw,44px);height:2px;margin-top:10px;background:var(--dim)}
.phase.running{background:var(--signal);box-shadow:0 0 12px rgba(255,255,255,.6)}
.phase.readying,.phase.homing{background:linear-gradient(90deg,var(--signal) 50%,var(--dim) 50%);background-size:8px 2px}
.link{position:fixed;top:var(--rail);left:var(--rail);width:9px;height:9px;border:1px solid var(--signal);
  border-radius:50%;display:none;animation:blink 1s steps(2) infinite;transform:translate(-14px,4px)}
body.offline .link{display:block}
@keyframes blink{50%{opacity:0}}

.stages{top:50%;left:var(--rail);transform:translateY(-50%);display:flex;flex-direction:column;gap:22px;align-items:center}
.stages svg{width:30px;height:30px;stroke:var(--dim);fill:none;stroke-width:1.4;transition:stroke .4s,filter .4s}
.stages svg.done{stroke:var(--ash)}
.stages svg.now{stroke:var(--signal);filter:drop-shadow(0 0 6px rgba(255,255,255,.7))}
.stages svg.now .core{fill:var(--signal)}
.swatch{width:16px;height:16px;margin-top:10px;border-radius:2px;transition:background .4s;outline:1px solid var(--dim);outline-offset:3px}
.target{width:22px;height:22px;border-radius:50%;border:3px solid var(--dim);transition:border-color .4s}

.joints{top:50%;right:var(--rail);transform:translateY(-50%);display:flex;gap:12px}
.track{position:relative;width:2px;height:clamp(110px,22vh,220px);background:var(--graphite)}
.track i{position:absolute;left:-5px;width:12px;height:2px;background:var(--signal);transition:bottom .09s linear}
.track u{position:absolute;left:-7px;width:16px;height:6px;border:1px solid var(--ash);margin-bottom:-2px;
  transition:bottom .09s linear}
.track.grip{background:linear-gradient(var(--graphite),var(--graphite)) center/2px 100% no-repeat;width:2px}

.scope{top:var(--rail);right:var(--rail);display:flex;align-items:center;gap:14px}
.scope svg{width:clamp(90px,11vw,160px);height:30px}
.scope polyline{fill:none;stroke:var(--ash);stroke-width:1}
.scope .num{font-size:clamp(20px,2.2vw,32px);font-weight:300;min-width:3.2ch;text-align:right}
.beat{width:7px;height:7px;border-radius:50%;background:var(--dim)}
.beat.on{background:var(--signal);box-shadow:0 0 10px var(--signal)}

.bowls{bottom:calc(var(--rail) + 44px);left:var(--rail);display:flex;gap:16px}
.bowl{width:clamp(40px,4vw,56px);aspect-ratio:1;border-radius:50%;border:2px solid var(--dim);display:grid;
  place-items:center;font-size:clamp(14px,1.4vw,19px);font-weight:400;transition:box-shadow .4s}
.bowl.active{box-shadow:0 0 0 2px var(--void),0 0 0 3px var(--signal)}

.timeline{left:var(--rail);right:calc(var(--rail) + clamp(200px,24vw,340px) + 24px);bottom:var(--rail);
  display:flex;align-items:center;gap:14px}
.timeline .dots{flex:1;display:flex;gap:7px;align-items:center;border-top:1px solid var(--graphite);padding-top:10px;
  overflow:hidden}
.dot{width:9px;height:9px;border-radius:50%;flex:none}
.dot.fail{border:1px solid var(--ash)}
.dot.run{border:1px solid var(--signal);animation:breathe 1.6s ease-in-out infinite}
.timeline .total{font-size:clamp(34px,3.8vw,56px);line-height:.9;font-weight:200;font-stretch:118%}
.timeline .cyc{font-size:clamp(13px,1.1vw,16px);color:var(--ash);align-self:flex-end;min-width:4ch}

.inset{right:var(--rail);bottom:var(--rail);width:clamp(200px,24vw,340px);aspect-ratio:4/3;
  outline:1px solid var(--graphite);background:var(--void)}
.inset img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:grayscale(1) contrast(1.15) brightness(.85);
  opacity:0;transition:opacity .5s}
.inset img.live{opacity:1}
.inset svg{position:absolute;inset:0;width:100%;height:100%}
.inset .box{fill:none;stroke-width:6}
.inset .tgt path{fill:none;stroke:var(--signal);stroke-width:4}
.inset .plate{fill:none;stroke-width:3;stroke-dasharray:6 8;opacity:.7}
.inset .held{fill:none;stroke:var(--signal);stroke-width:4}
.inset .arc{fill:none;stroke:var(--signal);stroke-width:6;stroke-linecap:round;transition:stroke-dashoffset .4s}
.inset .defect{stroke-dasharray:4 10}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body class="offline">
<div class="floor"></div>
<div class="twin"><img id="twin" alt=""><div class="wait"></div></div>

<span class="link"></span>
<div class="inst mono"><div><b id="mono">·</b><span class="phase" id="phase"></span></div><sup id="steps"></sup></div>

<div class="inst stages" aria-hidden="true">
  <svg id="st-pick" viewBox="0 0 30 30"><path d="M8 5 L15 19 L22 5"/><path d="M6 25 h18"/><circle class="core" cx="15" cy="22" r="2.2"/></svg>
  <svg id="st-bring" viewBox="0 0 30 30"><circle cx="15" cy="15" r="11"/><circle class="core" cx="15" cy="15" r="4"/></svg>
  <svg id="st-place" viewBox="0 0 30 30"><path d="M4 15 a11 11 0 0 0 22 0"/><circle class="core" cx="15" cy="8" r="2.6"/></svg>
  <div class="swatch" id="swatch"></div>
  <div class="target" id="target"></div>
</div>

<div class="inst joints" id="joints"></div>

<div class="inst scope"><span class="beat" id="beat"></span>
  <svg viewBox="0 0 160 30" preserveAspectRatio="none"><polyline id="trace"/></svg><span class="num" id="lat">–</span></div>

<div class="inst bowls" id="bowls"></div>

<div class="inst timeline"><span class="total" id="total">0</span><div class="dots" id="dots"></div><span class="cyc" id="cyc"></span></div>

<div class="inst inset" id="inset">
  <img id="cam" alt="">
  <svg id="ovl" viewBox="0 0 640 480" preserveAspectRatio="xMidYMid slice"></svg>
</div>

<script>
const $=id=>document.getElementById(id);
const COL={blue:'#3d7be0',brown:'#8b5a2b',red:'#d33b3b',white:'#f2f2f2',yellow:'#f2c230',purple:'#9b7fe0',orange:'#f08a24'};
const RANGE=[[-150,150],[-150,150],[-150,150],[-150,150],[-180,180],[0,100]];
const STAGES=['pick','bring','place'];
let cfg={twin:'',cams:''}, lastAge=1e9, lats=[], camMode='', joints=[];

// joint tracks
for(let j=0;j<6;j++){const t=document.createElement('div');t.className='track'+(j===5?' grip':'');
  t.innerHTML='<u></u><i></i>';$('joints').appendChild(t);joints.push(t)}
const pct=(v,j)=>{const[a,b]=RANGE[j];return Math.max(0,Math.min(100,(v-a)/(b-a)*100))};

function monogram(p){
  if(!p)return['·',''];
  const s=(p.policy||p.name||'').toLowerCase(), m=(p.name||'').match(/(\d+(?:\.\d+)?)k\b/i);
  const g=s.includes('molmo')?'M²':s.includes('pi0')||s.includes('pi05')?'π':s.includes('smol')?'S':
          s.includes('diffusion')||s.startsWith('dp')?'D':s.includes('act')?'A':s.slice(0,1).toUpperCase()||'·';
  return[g,m?m[1]+'k':''];
}

function stream(img,url){ // MJPEG <img> that fades in when frames arrive and retries when the stream drops
  if(!url){img.classList.remove('live');img.removeAttribute('src');return}
  img.onload=()=>img.classList.add('live');
  img.onerror=()=>{img.classList.remove('live');setTimeout(()=>{img.src=url+(url.includes('?')?'&':'?')+'r='+Date.now()},3000)};
  img.src=url;
}

function svgEl(tag,attrs){const e=document.createElementNS('http://www.w3.org/2000/svg',tag);
  for(const k in attrs)e.setAttribute(k,attrs[k]);return e}
function brackets([x0,y0,x1,y1],k=14){const g=svgEl('g',{class:'tgt'});
  const d=`M${x0} ${y0+k}V${y0}H${x0+k} M${x1-k} ${y0}H${x1}V${y0+k} M${x1} ${y1-k}V${y1}H${x1-k} M${x0+k} ${y1}H${x0}V${y1-k}`;
  g.appendChild(svgEl('path',{d}));return g}

function drawInset(s){
  const ovl=$('ovl'), p=s.perception||{}, step=(s.loop||{}).step||'';
  const inspecting=s.stage==='bring'||['bring','inspect','spin','tune'].includes(step);
  const want=inspecting?'inspect':'top';
  if(want!==camMode&&cfg.cams!==undefined){camMode=want;stream($('cam'),cfg.cams?`${cfg.cams}/stream/${want}`:'')}
  ovl.replaceChildren();
  if(want==='top'){
    for(const pl of p.plates||[])ovl.appendChild(svgEl('circle',{class:'plate',cx:pl.cx,cy:pl.cy,r:pl.r,stroke:COL[pl.colour]||'#777'}));
    for(const b of (p.table||[])){const[x0,y0,x1,y1]=b.box;
      ovl.appendChild(svgEl('rect',{class:'box',x:x0,y:y0,width:x1-x0,height:y1-y0,stroke:COL[b.colour]||'#fff'}))}
    if(p.target)ovl.appendChild(brackets(p.target.box));
  }else{
    const ins=p.inspect||{};
    if(ins.held){const[x0,y0,x1,y1]=ins.held;ovl.appendChild(svgEl('rect',{class:'held',x:x0,y:y0,width:x1-x0,height:y1-y0}))}
    const v=s.inspection||{};
    if(v.outcome){const r=200,c=2*Math.PI*r,f=Math.max(.05,Math.min(1,+v.confidence||1));
      ovl.appendChild(svgEl('circle',{class:'arc'+(v.outcome==='good'?'':' defect'),cx:320,cy:240,r,
        'stroke-dasharray':v.outcome==='good'?`${c*f} ${c}`:'4 10',transform:'rotate(-90 320 240)'}))}
  }
}

function render(s){
  const age=(s.link||{}).age_s;
  document.body.classList.toggle('offline',age==null||age>2);
  const[g,k]=monogram(s.policy);$('mono').textContent=g;$('steps').textContent=k;
  $('phase').className='phase '+(s.phase||'');
  // stages
  const si=STAGES.indexOf(s.stage), running=s.phase==='running'||s.phase==='readying';
  STAGES.forEach((st,i)=>{$('st-'+st).setAttribute('class',running&&i===si?'now':running&&i<si?'done':'')});
  $('swatch').style.background=COL[s.brick]||'transparent';
  $('target').style.borderColor=s.stage==='place'&&COL[s.bowl]?COL[s.bowl]:'var(--dim)';
  // joints: measured (solid tick) and commanded (hollow)
  const m=s.measured||[], c=s.cmd||[];
  joints.forEach((t,j)=>{if(m[j]!=null)t.querySelector('i').style.bottom=pct(m[j],j)+'%';
    if(c[j]!=null)t.querySelector('u').style.bottom=pct(c[j],j)+'%'});
  // inference latency scope + chunk heartbeat
  if(s.latency_ms!=null){lats.push(s.latency_ms);if(lats.length>90)lats.shift();$('lat').textContent=Math.round(s.latency_ms)}
  const lo=Math.min(...lats)-20,hi=Math.max(...lats)+20;
  $('trace').setAttribute('points',lats.map((v,i)=>`${i*160/89},${28-(v-lo)/(hi-lo||1)*26}`).join(' '));
  const ca=s.chunk_age_s;if(ca!=null&&ca<lastAge-0.05){$('beat').classList.add('on');setTimeout(()=>$('beat').classList.remove('on'),140)}
  if(ca!=null)lastAge=ca;
  // bowls and tallies
  const L=s.loop||{}, tal=L.tallies||{}, bowls=s.bowls||['yellow','purple','orange'];
  if($('bowls').children.length!==bowls.length){$('bowls').replaceChildren(...bowls.map(b=>{const d=document.createElement('div');
    d.className='bowl';d.dataset.b=b;d.style.borderColor=COL[b]||'#777';return d}))}
  [...$('bowls').children].forEach(d=>{d.textContent=tal[d.dataset.b]||0;d.classList.toggle('active',s.stage==='place'&&s.bowl===d.dataset.b)});
  // production timeline
  const cyc=L.cycles||[];
  $('dots').replaceChildren(...cyc.map(cy=>{const d=document.createElement('span');
    d.className='dot'+(cy.result==='running'?' run':cy.result==='sorted'?'':' fail');
    if(cy.result==='sorted')d.style.background=COL[cy.brick]||'#fff';return d}));
  $('total').textContent=Object.values(tal).reduce((a,b)=>a+b,0);
  const last=[...cyc].reverse().find(x=>x.result==='sorted'&&x.seconds);$('cyc').textContent=last?last.seconds.toFixed(1):'';
  drawInset(s);
}

async function poll(){try{render(await fetch('/api/state').then(r=>r.json()))}catch(e){document.body.classList.add('offline')}}
(async()=>{try{cfg=await fetch('/api/config').then(r=>r.json())}catch(e){}
  stream($('twin'),cfg.twin);setInterval(poll,100);poll()})();
</script>
</body>
</html>

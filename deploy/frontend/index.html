<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Station</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@300;400&display=swap" rel="stylesheet">
<style>
:root{--bg:#000;--fg:#fff;--muted:#8c8c8c;--line:#222;--pad:clamp(16px,2vw,32px)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--fg)}
body{font-family:"Barlow",system-ui,sans-serif;font-weight:300;font-variant-numeric:tabular-nums;
  -webkit-font-smoothing:antialiased;display:grid;grid-template-rows:1fr auto;height:100vh}
.view{position:relative;overflow:hidden;min-height:0}
.view img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;opacity:0;transition:opacity .8s}
.view img.live{opacity:1}
.bar{display:flex;align-items:baseline;gap:clamp(24px,4vw,64px);padding:var(--pad);border-top:1px solid var(--line)}
.stage{flex:1;font-size:clamp(20px,2vw,30px)}
.n{font-size:clamp(28px,3vw,46px);line-height:1}
.n small{font-size:.42em;color:var(--muted);margin-left:6px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--fg);align-self:center}
body.offline .dot{background:none;border:1px solid var(--muted)}
body.offline .stage,body.offline .n{color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body class="offline">
<div class="view"><img id="twin" alt="Digital twin"><img id="cam" alt="Top camera"></div>
<div class="bar">
  <span class="stage" id="stage"></span>
  <span class="n" id="sorted">0<small>sorted</small></span>
  <span class="n" id="rate">–<small>/min</small></span>
  <span class="dot"></span>
</div>
<script>
const $=id=>document.getElementById(id);
const STEP={survey:'Survey',verify:'Survey',pick:'Pick',grasp:'Pick',bring:'Bring',tune:'Bring',inspect:'Inspect',
  inspecting:'Inspect',spin:'Inspect',place:'Place',release:'Place',idle:'Idle',done:'Done',paused:'Paused'};
let twinLive=false;
function stream(img,url){if(!url)return;
  img.onload=()=>{img.classList.add('live');if(img.id==='twin'){twinLive=true;$('cam').style.display='none'}};
  img.onerror=()=>{img.classList.remove('live');if(img.id==='twin'){twinLive=false;$('cam').style.display=''}
    setTimeout(()=>{img.src=url+(url.includes('?')?'&':'?')+'r='+Date.now()},3000)};
  img.src=url}
function render(s){
  const age=(s.link||{}).age_s;document.body.classList.toggle('offline',age==null||age>2);
  const L=s.loop||{};
  const stage=STEP[L.step]||(s.phase==='running'?{pick:'Pick',bring:'Bring',place:'Place'}[s.stage]:s.phase==='stopped'?'Stopped':'Idle');
  $('stage').textContent=stage||'';
  const sorted=Object.values(L.tallies||{}).reduce((a,b)=>a+b,0);
  $('sorted').firstChild.nodeValue=sorted;
  const mins=L.started&&s.now?(s.now-L.started)/60:0;
  $('rate').firstChild.nodeValue=mins>0.5&&sorted?(sorted/mins).toFixed(1):'–';
}
async function poll(){try{render(await fetch('/api/state').then(r=>r.json()))}catch(e){document.body.classList.add('offline')}}
(async()=>{let cfg={};try{cfg=await fetch('/api/config').then(r=>r.json())}catch(e){}
  stream($('twin'),cfg.twin);if(cfg.cams)stream($('cam'),`${cfg.cams}/stream/top`);
  setInterval(poll,250);poll()})();
</script>
</body>
</html>
